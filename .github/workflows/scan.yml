name: Signal Scanner FII
on:
  schedule:
    - cron: "13 21 * * 1-5"   # 18h13 em Brasilia (UTC-3), dias uteis
  workflow_dispatch: {}       # permite rodar manualmente pelo botao "Run workflow"
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Rodar scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
      - name: Salvar estado (evita reenvio do mesmo sinal)
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state.json docs/results.json
          git diff --staged --quiet || git commit -m "update state and results [skip ci]"
          git push
 
